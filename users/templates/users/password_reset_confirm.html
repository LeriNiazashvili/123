{% extends 'store/base.html' %}
{% block title %}ახალი პაროლი{% endblock %}
{% block content %}
  {% if validlink %}
    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">პაროლის შენახვა</button>
    </form>
  {% else %}
    <p>ბმული აღარ არის მოქმედი. სცადე პაროლის აღდგენა თავიდან.</p>
    <p><a href="{% url 'password_reset' %}">პაროლის აღდგენა</a></p>
  {% endif %}
{% endblock %}
